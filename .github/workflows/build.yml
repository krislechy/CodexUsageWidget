name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core regressions and English native UI
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Package Portable and Lite
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageWidget-win-x64-both
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
